["review_sections"]
"1" = '''The following response to the question has been provided by ChatGPT. You will be asked some questions about this response.

<div style="margin-left: 40px;">"This behavior is mainly an example of status quo bias. Employees use their current nominal salary as the default and resist an explicit wage cut because it changes an established arrangement. By contrast, a salary increase follows the familiar expectation that pay should rise over time, so it feels consistent with the status quo even if the increase is modest. The different judgments therefore arise because people prefer policies that preserve the existing direction of salary changes and dislike policies that visibly alter the current contract."</div>

How well do you think that this response answers the question concerning the case?'''
"2" = '''The following response to the question has been provided by ChatGPT. You will be asked some questions about this response.

<div style="margin-left: 40px;">"The finding is explained by ordinary risk aversion. Consumers prefer the safer insecticide, so they are willing to pay a premium to remove its risks. The slightly more dangerous version exposes them to an uncertain injury, and a risk-averse person may reject that gamble even when the product is discounted. The pattern therefore shows that people consistently choose safety over price when the possible consequence is a serious health problem."</div>

How well do you think that this response answers the question concerning the case?'''
"3" = '''The following response to the question has been provided by ChatGPT. You will be asked some questions about this response.

<div style="margin-left: 40px;">"This behavior reflects the endowment effect and reciprocity. Once recipients are given the item, ownership makes it feel more valuable than it did when they merely considered buying it. They may also value the gift because it represents another person's effort and creates a desire to reciprocate. These two forces explain why someone can be pleased with an object after receiving it even though they did not value it enough to purchase it before."</div>

How well do you think that this response answers the question concerning the case?'''
"4" = '''The following response to the question has been provided by ChatGPT. You will be asked some questions about this response.

<div style="margin-left: 40px;">"The result is driven by loss aversion and the pain of paying. Spending one large note creates a single, highly visible loss, so people hesitate to hand it over. Spending coins creates many tiny losses, each of which feels too small to matter. Because the psychological pain attached to the large note is stronger than the pain attached to any individual coin, consumers are more willing to make a purchase when the same total amount is divided into smaller denominations."</div>

How well do you think that this response answers the question concerning the case?'''
"5" = '''The following response to the question has been provided by ChatGPT. You will be asked some questions about this response.

<div style="margin-left: 40px;">"This is an anchoring effect. The first number consumers see is the very small daily price, such as 50 cents, and that low value becomes the anchor for judging whether the subscription is expensive. People do not adjust enough when they think about repeated payments over the year, so the offer continues to feel cheap. Presenting the annual amount supplies a much larger anchor and therefore reduces willingness to subscribe."</div>

How well do you think that this response answers the question concerning the case?'''
"6" = '''The following response to the question has been provided by ChatGPT. You will be asked some questions about this response.

<div style="margin-left: 40px;">"The behavior is a simple framing effect caused by the emotional meaning of the labels. Calling the payment a bonus makes students feel rewarded and optimistic, which encourages consumption. Calling the identical payment a rebate reminds them of the cost of tuition and puts them in a more cautious mood, so they save it. The wording changes their general attitude toward the money even though the amount and their wealth are the same."</div>

How well do you think that this response answers the question concerning the case?'''
"7" = '''The following response to the question has been provided by ChatGPT. You will be asked some questions about this response.

<div style="margin-left: 40px;">"This pattern is caused by present bias. On a busy day, drivers earn money quickly and the immediate attraction of going home becomes stronger than the delayed benefit of earning still more. On a quiet day, low current earnings make the need for income more salient, so they keep working despite the waiting time. The drivers therefore overweight immediate leisure once the day already feels successful."</div>

How well do you think that this response answers the question concerning the case?'''
"8" = '''The following response to the question has been provided by ChatGPT. You will be asked some questions about this response.

<div style="margin-left: 40px;">"The difference is an endowment effect. Buying the tickets creates stronger psychological ownership because the person deliberately selected and paid for the experience. That ownership raises the perceived value of the show, so the buyer is more willing to overcome the storm and strike. A person who received the tickets has weaker attachment to them and can give them up more easily."</div>

How well do you think that this response answers the question concerning the case?'''
"9" = '''The following response to the question has been provided by ChatGPT. You will be asked some questions about this response.

<div style="margin-left: 40px;">"The result is caused by the endowment effect. When people focus on a single dinner set, they quickly imagine it as their own and value its most noticeable features. The complete-looking set B therefore acquires a stronger sense of ownership and receives a higher price. When both sets are displayed, subjects spread their attention across them and the ownership feeling weakens, allowing the larger set A to receive the higher valuation."</div>

How well do you think that this response answers the question concerning the case?'''
"10" = '''The following response to the question has been provided by ChatGPT. You will be asked some questions about this response.

<div style="margin-left: 40px;">"The behavior is explained by the affect heuristic and availability. Harm to a child is vivid and emotionally charged, so people can easily imagine the injury and respond with anger toward the pyjama company. The bank's financial loss is abstract and produces less emotion. Subjects therefore award more punitive damages to the child case because the vivid event is easier to picture and feels more serious."</div>

How well do you think that this response answers the question concerning the case?'''

