["cases"]
"1" = '''
Subjects are faced with one of the following two questions:

a. A company is making a small profit. It is located in a community experiencing a recession with substantial unemployment but no inflation. The company decides to decrease wages and salaries 7 percent this year. Is this acceptable or unfair?

b. A company is making a small profit. It is located in a community experiencing a recession with substantial unemployment and inflation of 12 percent. The company decides to increase salaries only 5 percent this year. Is this acceptable or unfair?

The typical finding is that most subjects find the policy in a. unfair, and most find that the policy in b. is acceptable.'''

"2" = '''
Subjects were shown a can of fictitious insecticide. The current price was said to be $10. They were informed that all insecticide can cause injuries if misused, including inhalation and skin poisoning. The current risk level was said to be 15 injuries of each type per 10,000 bottles sold.

They were asked how much more than $10 they would be willing to pay to eliminate the risks.

They were also asked to state the price reduction they would require to accept an increase of 1/10,000 in each of the two risks.

In households without children, the typical finding is that people would be prepared to pay just under $4 to eliminate the risks, but would refuse to buy the slightly-more risky version of the product at any positive price (i.e. they wouldn’t even buy it at a price of $1).'''

"3" = '''
There is a tendency for people to offer gifts that the receivers of the gifts would not buy for themselves even though they can afford it, and for these receivers to (often) be happy to receive such gifts.'''

"4" = '''
Typical findings indicate that people are more likely to engage in a purchase in a particular time-frame (say, in a week) using a monetary sum if it is held in small denominations (e.g. twenty €1 coins) than if it is held in large denominations (e.g. one $20 note).'''

"5" = '''
People are more likely buy e.g. subscriptions if the price is expressed as “pennies per day” (e.g. 50 cents a day) rather than as a lump sum (e.g. €182.50 a year).'''

"6" = '''
In a study, university students were each given $50, and asked, one week later, how much of it they saved and spent. Students in group A were told that the money was a rebate on their tuition fees; students in group B were told that it was a bonus. The study found that the students in group B spent significantly more than those in group A.'''

"7" = '''
Taxi drivers tend to work shorter hours on busy days – that is, on days where it is easier to find customers and so where they spend less time waiting for rides.'''

"8" = '''
In the survey, you were asked the following question:

You have tickets for a show. On the night of the show, there is a violent storm and a strike that makes it difficult to get to the venue.

a. You bought the tickets.

b. You got given the tickets.

Do you go?

Half of you answered the question with text a. (only), and the other half with b. (only). Typical findings are that more people go to the show under a. than under b.'''

"9" = '''
Consider the following two dinner sets:

Set A has 40 pieces: 8 dinner plates, 8 bowls and 8 dessert plates, all in good condition; 8 cups, 2 of them broken; and 8 saucers, 2 of them broken.

Set B has 24 pieces: 8 dinner plates, 8 bowls and 8 dessert plates, all in good condition.

One group of subjects (group A) only saw set A and were asked how much they would be willing to pay for it. Another group (call it B) only saw set B and were asked how much they would be willing to pay for it. The final group (group C) saw both sets and were asked how much they would be willing to pay for each.

Whereas the subjects in group C were on average willing to pay more for A than B, the subjects in group B were willing to pay more for set B than the subjects in group A were willing to pay for set A.'''

"10" = '''
Consider the following two legal cases:

Case 1: A child suffered moderate burns when his pyjamas caught fire as he was playing with matches. The firm that produced the pyjamas had not made them adequately fire resistant.

Case 2: The unscrupulous dealings of a bank caused another bank a loss of $10 million.

Subjects which are presented with Case 1 only and are asked to assess punitive damages award lower damages on average than subjects presented with Case 2 only. However, subjects presented with both cases together, and asked to assess damages for each, award higher damages in Case 1.'''

